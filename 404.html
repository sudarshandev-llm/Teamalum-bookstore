<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Team Alum Bookshelf</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon-192.svg">
<style>
  :root{--blue-deep:#0a2a52;--blue:#14508c;--blue-bright:#2f7bf5;--ink:#13233a;--ink-soft:#5b6f8a;--paper:#fff;--gold:#a3822f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:radial-gradient(1200px 600px at 50% -10%,rgba(47,123,245,.18),transparent 60%),var(--paper);
       color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;text-align:center}
  .card{max-width:520px;padding:44px 36px;border-radius:20px;background:var(--paper);
        box-shadow:0 18px 50px rgba(10,42,82,.12);border:1px solid rgba(10,42,82,.07)}
  .code{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:52px;letter-spacing:3px;
        color:var(--gold);margin:0 0 6px}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:26px;color:var(--blue-deep);margin:0 0 12px}
  p{font-size:14.5px;line-height:1.7;color:var(--ink-soft);margin:0 0 24px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--blue-bright);color:#fff;
        text-decoration:none;font-weight:600;font-size:14px}
  a.btn:hover{background:#1e63d0}
  a.ghost{background:transparent;color:var(--blue);border:1px solid rgba(20,80,140,.25)}
  a.ghost:hover{background:rgba(47,123,245,.07)}
  .links{margin-top:26px;font-size:13px;color:var(--ink-soft)}
  .links a{color:var(--blue-bright);text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>
      The link may be out of date. Everything about the book — the free preview, plans and
      your license — lives on the storefront.
    </p>
    <div class="actions">
      <a class="btn" href="/">Back to the bookstore</a>
      <a class="btn ghost" href="/redeem">Redeem a code</a>
    </div>
    <p class="links">
      Need the admin panel? <a href="/admin">Go to /admin</a>
    </p>
  </div>
</body>
</html>
