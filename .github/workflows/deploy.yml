name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Please add it in GitHub repo Settings > Secrets."
            exit 1
          fi
          vercel --prod --yes --token=$VERCEL_TOKEN

      - name: Summary
        run: echo "Deployment completed — check https://teamalum-bookstore.vercel.app" >> $GITHUB_STEP_SUMMARY
