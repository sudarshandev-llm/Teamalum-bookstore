<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Team Alum Admin</title>
<link rel="icon" href="/icon-192.svg">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(135deg,#0a2a52 0%,#0f3a6e 60%,#14508c 100%);
       color:#eaf1ff;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
  .box{max-width:460px;padding:38px 32px;border-radius:16px;background:rgba(255,255,255,.06);
       border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(4px)}
  h1{font-size:22px;margin:0 0 10px;font-weight:600}
  p{margin:0 0 20px;font-size:14px;line-height:1.65;color:rgba(234,241,255,.75)}
  a.btn{display:inline-block;padding:11px 24px;border-radius:999px;background:#3b82f6;color:#fff;
        text-decoration:none;font-weight:600;font-size:14px}
  a.btn:hover{background:#2563eb}
  .spin{margin-top:22px;font-size:12px;color:rgba(234,241,255,.55);letter-spacing:.5px}
</style>
</head>
<body>
  <div class="box">
    <h1>The admin panel has moved</h1>
    <p>
      There is now a single admin panel for the bookstore. It contains everything the old
      panel had, plus purchase requests, activated devices and the book content editor.
    </p>
    <a class="btn" href="/admin">Open the admin panel</a>
    <div class="spin" id="status">Redirecting…</div>
  </div>
  <script>
    // Immediate redirect so nobody lands on a stale copy of the old panel.
    setTimeout(function () { window.location.replace('/admin'); }, 400);
  </script>
</body>
</html>
